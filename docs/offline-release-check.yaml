# Draft only: copy this file to .github/workflows/offline_release_check.yaml
# in a separately approved CI-only commit. It never runs the bot CLI.
name: Offline release check

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Full reviewed commit SHA of the candidate to validate"
        type: string
        required: true

permissions:
  contents: read

# Independent of the publication lock: this check cannot block the live bot.
concurrency:
  group: offline-release-check-${{ github.repository }}
  cancel-in-progress: false

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require an immutable candidate SHA
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "A full reviewed commit SHA is required." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Install locked dependencies
        run: poetry install --no-interaction --no-root
      - name: Record the tested version
        run: |
          git rev-parse HEAD
          poetry --version
          poetry run python --version
      - name: Offline regressions only
        env:
          METACULUS_PUBLICATION_BACKEND: github
        run: poetry run python -B -m tests.run --strict-known-bugs --report offline-results.json
      - name: Keep nonsecret offline results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-results-${{ inputs.candidate_sha }}
          path: offline-results.json
          if-no-files-found: warn
          retention-days: 30
