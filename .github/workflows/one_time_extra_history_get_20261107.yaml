# Single-use user approval 2026-11-07: two authenticated READ-only GETs maximum.
# bot-testing-area + current Metaculus Cup Fall 2026 (project 33108).
# No forecast publishing, model API tokens, retries, schedules, or manual reruns.
name: One-time Vrchcab extra-project history GET audit

on:
  push:
    branches:
      - diagnostics/open-questions-offline-20261107
    paths:
      - ".github/trigger_extra_history_get_20261107.txt"

permissions:
  contents: read

jobs:
  two_project_gets:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'Run approved two extra history GETs once'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout immutable reviewed code without git credentials
        uses: actions/checkout@v4
        with:
          ref: 744db865e0643f66befef3a4870a086f6495f642
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check strictly two GET target shapes offline
        run: python -B tools/extra_project_history_inventory_readonly.py --self-check
      - name: Check original audit safeguards with synthetic data offline
        run: python -B tools/test_project_history_inventory_offline.py
      - name: Execute at most two user-authorized project GETs, zero POSTs
        run: python -B tools/extra_project_history_inventory_readonly.py --run-two-extra-project-gets
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN_V2 }}
