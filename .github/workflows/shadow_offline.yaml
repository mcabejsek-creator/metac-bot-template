name: Shadow comparison offline safety
on:
  pull_request:
    paths:
      - 'shadow_*.py'
      - 'tests/test_shadow*.py'
      - 'tests/test_github_workflows.py'
      - '.github/workflows/openai_shadow.yaml'
      - '.github/workflows/shadow_report.yaml'
      - '.github/workflows/shadow_offline.yaml'
      - '.github/workflows/run_bot_automatic.yaml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - run: poetry install --no-interaction --no-root
      - name: Focused offline shadow tests
        run: poetry run python -B -m unittest tests.test_shadow_comparison tests.test_shadow_pipeline tests.test_shadow_runner_followup tests.test_shadow_evaluate tests.test_shadow_report -v
      - name: All existing and new regressions
        env:
          METACULUS_PUBLICATION_BACKEND: github
        run: poetry run python -B -m tests.run --strict-known-bugs --report offline-results.json
