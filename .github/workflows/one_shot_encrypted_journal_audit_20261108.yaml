# SINGLE-USE, segregated source-branch audit. Zero GitHub state writes.
# Not a forecast workflow. No Metaculus HTTP or paid model credentials.
# Initial staging commits cannot authorize the live job.
name: Vrchcab encrypted journal audit (one-shot GET only)

on:
  push:
    branches:
      - "fix/bounded-futureeval-pagination-20261107"

permissions:
  contents: read

concurrency:
  group: vrchcab-encrypted-journal-audit-single-use-20261108
  cancel-in-progress: false

jobs:
  offline_safety:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/fix/bounded-futureeval-pagination-20261107' &&
      github.event.head_commit.message == 'AUTHORIZE_ONCE_JOURNAL_AUDIT_20261108' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      METACULUS_TOKEN: ""
      METACULUS_TOKEN_V2: ""
      GITHUB_TOKEN: ""
      PERPLEXITY_API_KEY: ""
      OPENAI_API_KEY: ""
      OPENROUTER_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      ASKNEWS_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - run: poetry install --no-interaction --no-root
      - name: Local syntax check with no network credentials
        run: poetry run python -B -m py_compile tools/audit_publication_journal_readonly.py
      - name: Synthetic encrypted-journal self-check and explicit HTTP GET cap
        run: poetry run python -B tools/audit_publication_journal_readonly.py --self-check

  live_audit_get_only:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/fix/bounded-futureeval-pagination-20261107' &&
      github.event.head_commit.message == 'AUTHORIZE_ONCE_JOURNAL_AUDIT_20261108' &&
      github.run_attempt == 1
    needs: offline_safety
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN_V2 }}
      GITHUB_TOKEN: ${{ github.token }}
      METACULUS_PUBLICATION_STATE_BRANCH: "metaculus-publication-state"
      METACULUS_PUBLICATION_STATE_PATH: "publication.enc"
      METACULUS_PUBLICATION_SCOPE: "default-bot"
      VRCHCAB_APPROVE_READONLY_JOURNAL_AUDIT: "YES_GITHUB_GET_ONLY"
      PERPLEXITY_API_KEY: ""
      OPENAI_API_KEY: ""
      OPENROUTER_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      ASKNEWS_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - run: poetry install --no-interaction --no-root
      - name: Authorized GET-only manifest/shard audit; at most 202 GitHub GET attempts
        run: poetry run python -B tools/audit_publication_journal_readonly.py --approved-readonly
