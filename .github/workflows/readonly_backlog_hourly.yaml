# Scheduled read-only full backlog scan; up to 10 authenticated Metaculus GET requests.
# No publication, no model, no paid requests. Includes older still-open posts.
name: Vrchcab hourly full backlog scan (GET only)

on:
  schedule:
    - cron: "13 * * * *"

permissions:
  contents: read

concurrency:
  group: vrchcab-hourly-readonly-backlog
  cancel-in-progress: false

jobs:
  read_only_backlog:
    if: >-
      github.event_name == 'schedule' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      METACULUS_TOKEN: ""
      METACULUS_TOKEN_V2: ""
      PERPLEXITY_API_KEY: ""
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      ASKNEWS_API_KEY: ""
      ASKNEWS_CLIENT_ID: ""
      ASKNEWS_SECRET: ""
      GITHUB_TOKEN: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - run: poetry install --no-interaction --no-root
      - name: Offline safety self-check (no credentials)
        run: poetry run python -B tools/preflight_tournament_inventory_readonly.py --self-check
      - name: Authenticated GET-only full backlog and one candidate preview
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN_V2 }}
          VRCHCAB_SCHEDULED_BACKLOG_APPROVAL: "APPROVE_RECURRING_READONLY_MAX_TEN_GETS"
        run: poetry run python -B tools/preflight_tournament_inventory_readonly.py --run-scheduled-backlog-readonly
