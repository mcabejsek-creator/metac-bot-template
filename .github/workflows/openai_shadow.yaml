name: Vrchcab bounded OpenAI shadow comparison
on:
  workflow_run:
    workflows: [Vrchcab automatic tournament forecasts]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  actions: read
concurrency:
  group: vrchcab-shadow-sol-20261117-${{ github.repository }}
  cancel-in-progress: false
jobs:
  shadow:
    if: >-
      github.repository == 'mcabejsek-creator/metac-bot-template' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Install locked dependencies without credentials
        run: poetry install --no-interaction --no-root
      - name: Offline comparison regressions
        run: poetry run python -B -m unittest tests.test_shadow_comparison tests.test_shadow_runner_followup tests.test_shadow_ledger_size tests.test_shadow_evaluate
      - name: Prepare blind input and permanently reserve one attempt
        id: prepare
        run: poetry run python -B shadow_runner.py prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN_V2 }}
      - name: One isolated candidate request without publication credentials
        if: steps.prepare.outputs.ready == 'true'
        run: poetry run python -B shadow_runner.py infer
        env:
          VRCHCAB_OPENAI_TEST_KEY: ${{ secrets.VRCHCAB_OPENAI_TEST_KEY }}
      - name: Persist encrypted result without repeating inference
        if: ${{ always() && !cancelled() && steps.prepare.outputs.ready == 'true' }}
        run: poetry run python -B shadow_runner.py finish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN_V2 }}
