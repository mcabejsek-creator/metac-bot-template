# Manual-only. Never publishes forecasts; execution requires separate approval.
name: Metaculus history audit (read-only, aggregate-only)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout audited code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: c2b5b01ea909b360f63b69a3b8edb65de1acc2a4
      - name: Confirm immutable audited script revision
        run: |
          test "$(git rev-parse HEAD)" = "c2b5b01ea909b360f63b69a3b8edb65de1acc2a4"
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Read only own forecast inventory
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN_V2 }}
        run: |
          python -B tools/audit_metaculus_history.py \
            --user-id 307558 \
            --output metaculus-audit-summary.json
      - name: Upload aggregate summary only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: metaculus-history-aggregate
          path: metaculus-audit-summary.json
          if-no-files-found: error
          retention-days: 7
