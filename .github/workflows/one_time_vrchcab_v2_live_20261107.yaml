# ONE explicit user-authorized live run. Never rerun or automatically schedule.
# Only FutureEval (33121) plus current MiniBench. No Cup or test_questions.
name: One-time supervised Vrchcab FutureEval and MiniBench live run V2

on:
  push:
    branches:
      - ops/one-time-live-tournament-v2-20261107
    paths:
      - ".github/trigger_one_live_tournament_v2_20261107.txt"

permissions:
  contents: write

# Same lock as all three production publishers and journal initializer.
concurrency:
  group: metaculus-publication-${{ github.repository }}
  cancel-in-progress: false

jobs:
  approved_live_tournament:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'Run one approved Vrchcab V2 FutureEval and MiniBench live forecast'
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      EXPECTED_PRODUCTION_SHA: 3d54363f49768147606cde16698920ac514f29a6
      METACULUS_PUBLICATION_BACKEND: github
      METACULUS_PUBLICATION_STATE_BRANCH: metaculus-publication-state
      METACULUS_PUBLICATION_STATE_PATH: publication.enc
      METACULUS_PUBLICATION_SCOPE: default-bot
    steps:
      - name: Checkout audited production main commit
        uses: actions/checkout@v4
        with:
          ref: 3d54363f49768147606cde16698920ac514f29a6
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Install pinned dependencies
        run: poetry install --no-interaction --no-root
      - name: Verify exact production source and all offline regressions before credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCTION_SHA"
          python -B tools/test_post_rotation_secret_isolation.py
          .venv/bin/python -B -m bounded_run -- .venv/bin/python -B -c "print('SUPERVISOR_V2_OFFLINE_OK')"
          .venv/bin/python -B -m tests.run --strict-known-bugs
      - name: Verify protected encrypted journal (GitHub read-only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN_V2 }}
        run: |
          .venv/bin/python -B - <<'PY'
          from github_publication import configured_store
          configured_store().preflight()
          print("PROTECTED_JOURNAL_V2_PREFLIGHT_OK")
          PY
      - name: ONE authorized live tournament run, FutureEval and MiniBench only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN_V2 }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCTION_SHA"
          .venv/bin/python -B -m bounded_run -- .venv/bin/python -B main.py --mode tournament
