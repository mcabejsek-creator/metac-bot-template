name: Vrchcab prospective shadow accuracy report
on:
  schedule:
    - cron: '11 8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'shadow_report.py'
      - 'shadow_evaluate.py'
      - 'tests/test_shadow_report.py'
      - 'tests/test_shadow_evaluate.py'
      - '.github/workflows/shadow_report.yaml'
permissions:
  contents: read
concurrency:
  group: vrchcab-shadow-report-${{ github.repository }}
  cancel-in-progress: false
jobs:
  report:
    if: >-
      github.repository == 'mcabejsek-creator/metac-bot-template' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      (github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Install locked dependencies without credentials
        run: poetry install --no-interaction --no-root
      - name: Offline report regressions
        run: poetry run python -B -m unittest tests.test_shadow_evaluate tests.test_shadow_report
      - name: Evaluate recorded pairs using read-only outcomes
        run: poetry run python -B shadow_report.py --output shadow-report.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN_V2 }}
      - name: Keep aggregate accuracy report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shadow-accuracy-aggregate
          path: shadow-report.json
          if-no-files-found: error
          retention-days: 90
