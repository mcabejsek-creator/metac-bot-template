name: Offline release check

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Full reviewed commit SHA of the candidate to validate"
        type: string
        required: true

permissions:
  contents: read

# Independent of the publication lock: this check cannot block the live bot.
concurrency:
  group: offline-release-check-${{ github.repository }}
  cancel-in-progress: false

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require an immutable candidate SHA
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "A full reviewed commit SHA is required." >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Install locked dependencies
        run: poetry install --no-interaction --no-root
      - name: Record the tested version
        run: |
          git rev-parse HEAD
          poetry --version
          poetry run python --version
      - name: Offline regressions only
        env:
          METACULUS_PUBLICATION_BACKEND: github
        run: poetry run python -B -m tests.run --strict-known-bugs --report offline-results.json
      - name: Keep nonsecret offline results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offline-results-${{ inputs.candidate_sha }}
          path: offline-results.json
          if-no-files-found: warn
          retention-days: 30
