name: OpenAI bonus probe offline safety

# No secret access on PRs. Execute the complete existing offline regression suite.
on:
  pull_request:
    paths:
      - "tools/probe_openai_bonus.py"
      - "tests/test_openai_bonus_probe.py"
      - ".github/workflows/openai_bonus_probe.yaml"
      - ".github/workflows/openai_bonus_probe_ci.yaml"

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Install locked dependencies
        run: poetry install --no-interaction --no-root
      - name: New synthetic connectivity regressions
        run: poetry run python -B -m unittest tests.test_openai_bonus_probe -v
      - name: Complete offline regressions
        env:
          METACULUS_PUBLICATION_BACKEND: github
        run: poetry run python -B -m tests.run --strict-known-bugs --report offline-results.json
