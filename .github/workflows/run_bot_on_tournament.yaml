name: Forecast on new AI tournament questions

# Live publishing is deliberately locked until one explicit approved dispatch.
# Old cron-job.org calls without the new confirmation input are skipped.
# Reruns of the same workflow_dispatch are never publishing authorization.
on:
  workflow_dispatch:
    inputs:
      publication_approval:
        description: "ONE live forecast/publish run; requires separate operator authorization"
        type: choice
        required: true
        default: DO_NOT_RUN
        options:
          - DO_NOT_RUN
          - APPROVE_ONE_LIVE_PUBLICATION_RUN
      first_live_post_id:
        description: "Public post ID of ONE validated atomic question; requires separate approval"
        type: string
        required: true
        default: DO_NOT_RUN
  


permissions:
  contents: write

env:
  METACULUS_PUBLICATION_BACKEND: github
  METACULUS_PUBLICATION_STATE_BRANCH: metaculus-publication-state
  METACULUS_PUBLICATION_STATE_PATH: publication.enc
  METACULUS_PUBLICATION_SCOPE: default-bot

# Shared by every workflow publishing as this bot, across source branches/reruns.
concurrency:
  group: metaculus-publication-${{ github.repository }}
  cancel-in-progress: false

# Daily job to run the simple forecast bot
jobs:
  forecast_job:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publication_approval == 'APPROVE_ONE_LIVE_PUBLICATION_RUN' &&
      inputs.first_live_post_id != 'DO_NOT_RUN' &&
      inputs.first_live_post_id != '' &&
      github.run_attempt == 1
    timeout-minutes: 210 # Setup/tests + 180-minute supervised bot + shutdown margin.
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      # Adding the below will make the workflow faster, but will mean you don't automatically get updates from forecasting-tools and other packages
      # - name: Load cached venv
      #   id: cached-poetry-dependencies
      #   uses: actions/cache@v4
      #   with:
      #     path: .venv
      #     key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Offline publication regressions
        run: poetry run python -B -m tests.run
      - name: Run bot
        run: |
          .venv/bin/python -B -m bounded_run -- .venv/bin/python -B main.py --mode tournament --first-live-post-id "$FIRST_LIVE_POST_ID"
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          FIRST_LIVE_POST_ID: ${{ inputs.first_live_post_id }}
          GITHUB_TOKEN: ${{ github.token }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN_V2 }} # replace this with the name of the variable under which you stored your own Metaculus token
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
