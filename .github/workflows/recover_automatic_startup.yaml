name: Recover automatic forecast startup

# Existing immediate jobless-startup recovery plus a bounded stalled-chain fallback.
# This also needs working GitHub Actions/webhook delivery; it is not an
# independent scheduler outside GitHub's failure domain.
on:
  workflow_run:
    workflows:
      - "Vrchcab automatic tournament forecasts"
      - "Vrchcab hourly full backlog scan (GET only)"
      - "Review forecast quality and automatic operation"
    types: [completed]
    branches: [main]
  schedule:
    - cron: "11,41 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: vrchcab-startup-recovery-${{ github.repository }}
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.repository == 'mcabejsek-creator/metac-bot-template' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.conclusion == 'startup_failure' &&
      github.event.workflow_run.path == '.github/workflows/run_bot_automatic.yaml'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted main revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Offline startup recovery regressions
        run: python -B -m unittest discover -s tests -p test_recover_automatic_startup.py
      - name: Request one fresh automatic pass
        run: python -B tools/recover_automatic_startup.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

  recover_stalled:
    if: >-
      github.repository == 'mcabejsek-creator/metac-bot-template' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      (github.event_name == 'schedule' ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.event == 'schedule' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.run_attempt == 1 &&
         (github.event.workflow_run.path == '.github/workflows/readonly_backlog_hourly.yaml' ||
          github.event.workflow_run.path == '.github/workflows/review_bot.yaml') &&
         (github.event.workflow_run.conclusion == 'success' ||
          github.event.workflow_run.conclusion == 'failure')))
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check out trusted main revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Offline recovery regressions
        run: python -B -m unittest discover -s tests -p test_recover_automatic_startup.py
      - name: Check stalled production and request at most one fresh pass
        run: python -B tools/recover_automatic_startup.py --stale
        env:
          GITHUB_TOKEN: ${{ github.token }}
