name: Recover automatic forecast startup

# A run that never created a job cannot execute its own successor callback.
# This also needs working GitHub Actions/webhook delivery; it is not an
# independent scheduler outside GitHub's failure domain.
on:
  workflow_run:
    workflows: ["Vrchcab automatic tournament forecasts"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: vrchcab-startup-recovery-${{ github.repository }}
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.repository == 'mcabejsek-creator/metac-bot-template' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.conclusion == 'startup_failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted main revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Offline startup recovery regressions
        run: python -B -m unittest discover -s tests -p test_recover_automatic_startup.py
      - name: Request one fresh automatic pass
        run: python -B tools/recover_automatic_startup.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
