# One-time verification, approved 2026-11-07. NO publishing or mutation.
# Exactly one authenticated GET for NEW token, and one for OLD if new is verified.
name: One-time validate Vrchcab token rotation

on:
  push:
    branches:
      - diagnostics/verify-rotated-credentials-20261107
    paths:
      - ".github/run_once_verify_vrchcab_rotation_20261107.txt"

permissions:
  contents: read

jobs:
  rotation_check:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'Run once verified Vrchcab credential rotation check'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout immutable audited code
        uses: actions/checkout@v4
        with:
          ref: 143bcad64bf837737b3d101916eccb7907650269
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline self-check before credentials are exposed to any step
        run: python -B tools/verify_rotated_metaculus_credentials_readonly.py --self-check
      - name: Check new secret then old token (GET only, no retries)
        run: python -B tools/verify_rotated_metaculus_credentials_readonly.py --verify-rotated-pair
        env:
          METACULUS_TOKEN_V2: ${{ secrets.METACULUS_TOKEN_V2 }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
