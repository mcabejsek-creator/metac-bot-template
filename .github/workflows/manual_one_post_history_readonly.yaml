# Single explicitly approved Metaculus GET, no cron, no publisher.
# Exact-choice selection restricts GETs to the two already approved live posts.
name: Vrchcab manual single-post forecast history (GET only)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "ONE Metaculus GET to inspect known first-live post history; no publishing"
        type: choice
        required: true
        default: DO_NOT_RUN
        options:
          - DO_NOT_RUN
          - YES_ONE_HISTORY_GET
      post_id:
        description: "ONE previously published public post ID to verify (no discovery)"
        type: choice
        required: true
        default: DO_NOT_RUN
        options:
          - DO_NOT_RUN
          - "46347"
          - "46335"

permissions:
  contents: read

concurrency:
  group: vrchcab-manual-one-history-get
  cancel-in-progress: false

jobs:
  read_only_history:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirmation == 'YES_ONE_HISTORY_GET' &&
      (inputs.post_id == '46347' || inputs.post_id == '46335') &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Offline syntax check; no secrets
        run: python -B -m py_compile metaculus_one_post_history_readonly.py tools/check_known_metaculus_history_readonly.py
      - name: Exactly one authenticated V2 bot post-history GET (no POST or LLM)
        env:
          METACULUS_TOKEN_V2: ${{ secrets.METACULUS_TOKEN_V2 }}
          VRCHCAB_ONE_HISTORY_GET_APPROVAL: ${{ inputs.confirmation }}
          VRCHCAB_ONE_HISTORY_POST_ID: ${{ inputs.post_id }}
          GITHUB_TOKEN: ''
          PERPLEXITY_API_KEY: ''
          OPENROUTER_API_KEY: ''
          OPENAI_API_KEY: ''
        run: python -B tools/check_known_metaculus_history_readonly.py --one-approved-get
