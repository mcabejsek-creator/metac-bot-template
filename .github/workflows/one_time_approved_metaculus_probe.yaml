# One-time approved public GET probe, isolated from publishing workflows.
name: One-time approved Metaculus public GET probe

on:
  push:
    branches:
      - diagnostics/open-questions-offline-20261107
    paths:
      - ".github/approved_metaculus_probe_trigger_20261107.txt"

permissions:
  contents: read

jobs:
  one_time_public_probe:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'Execute approved two public Metaculus GETs (once)'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      METACULUS_TOKEN: ""
      PERPLEXITY_API_KEY: ""
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      EXA_API_KEY: ""
      ASKNEWS_API_KEY: ""
      ASKNEWS_CLIENT_ID: ""
      ASKNEWS_SECRET: ""
    steps:
      - name: Checkout isolated diagnostic branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Confirm public read-only request shapes without networking
        run: python -B tools/probe_open_questions_readonly.py --self-check
      - name: Make at most two authorized public GETs, never POST or retry
        run: python -B tools/probe_open_questions_readonly.py --run-two-public-gets
