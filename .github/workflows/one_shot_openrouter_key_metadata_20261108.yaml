# Operator-approved, one-time, read-only OpenRouter API key metadata audit.
# GET https://openrouter.ai/api/v1/key exactly once; no chat completions,
# no model calls, no POST, no billing change, no GitHub write permissions.
# No raw secret, raw key label, creator user ID, or full API reply is logged.
name: Vrchcab ONE-SHOT OpenRouter key read-only metadata
on:
  push:
    branches:
      - ops/read-only-openrouter-key-20261108
    paths:
      - ".github/workflows/one_shot_openrouter_key_metadata_20261108.yaml"

permissions:
  contents: read

concurrency:
  group: vrchcab-one-shot-openrouter-key-metadata-20261108
  cancel-in-progress: false

jobs:
  get_key_metadata_once:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/ops/read-only-openrouter-key-20261108' &&
      github.repository == 'mcabejsek-creator/metac-bot-template' &&
      github.event.head_commit.message == 'AUTHORIZE_ONCE_READ_ONLY_OPENROUTER_KEY_METADATA_20261108' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GITHUB_TOKEN: ""
      OPENAI_API_KEY: ""
      PERPLEXITY_API_KEY: ""
      METACULUS_TOKEN: ""
      METACULUS_TOKEN_V2: ""
    steps:
      - name: One GET only to OpenRouter current-key metadata (no model invocation)
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          key = os.environ.get("OPENROUTER_API_KEY", "").strip()
          if not key or len(key) < 12 or any(ch.isspace() for ch in key):
              raise SystemExit("OPENROUTER_SECRET_MISSING_OR_MALFORMED")
          if os.environ.get("GITHUB_REPOSITORY") != "mcabejsek-creator/metac-bot-template":
              raise SystemExit("UNEXPECTED_REPOSITORY_NO_REQUEST")

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          url = "https://openrouter.ai/api/v1/key"
          request = urllib.request.Request(
              url, method="GET", headers={
                  "Authorization": "Bearer " + key,
                  "Accept": "application/json",
                  "User-Agent": "vrchcab-authorized-readonly-key-diagnostic",
              })
          opener = urllib.request.build_opener(NoRedirect())
          try:
              with opener.open(request, timeout=20) as response:
                  if response.status != 200:
                      raise SystemExit("UNEXPECTED_API_STATUS_NO_RETRY")
                  raw = response.read(16001)
                  if len(raw) > 16000:
                      raise SystemExit("API_RESPONSE_TOO_LARGE_NO_RETRY")
          except urllib.error.HTTPError as error:
              print("OPENROUTER_GET_ONLY_HTTP_STATUS=" + str(error.code), flush=True)
              raise SystemExit(1) from None
          except (OSError, TimeoutError):
              print("OPENROUTER_GET_ONLY_NETWORK_ERROR_NO_RETRY", flush=True)
              raise SystemExit(1) from None

          try:
              data = json.loads(raw)["data"]
              if not isinstance(data, dict):
                  raise ValueError()
              print("OPENROUTER_READ_ONLY_KEY_METADATA_OK=true", flush=True)
              label = data.get("label", "")
              # Only last three characters of a provider-MASKED key label.
              # Never show unmasked label, actual token or creator_user_id.
              match = re.search(r"\\.\\.\\.([A-Za-z0-9]{3,4})$", label) if isinstance(label, str) else None
              print("OPENROUTER_MASKED_KEY_SUFFIX=" + (match.group(1)[-3:] if match else "unavailable"), flush=True)
              for name in ("usage", "usage_daily", "usage_weekly", "usage_monthly", "limit", "limit_remaining"):
                  value = data.get(name)
                  if value is None:
                      safe = "not_set"
                  elif type(value) in (float, int) and 0 <= value < 1000000:
                      safe = format(value, ".5f")
                  else:
                      safe = "unavailable"
                  print("OPENROUTER_" + name.upper() + "_USD=" + safe, flush=True)
              reset = data.get("limit_reset")
              print("OPENROUTER_LIMIT_RESET=" + (reset if reset in ("daily", "weekly", "monthly") else "none"), flush=True)
              print("OPENROUTER_IS_MANAGEMENT_KEY=" + str(data.get("is_management_key") is True).lower(), flush=True)
              print("OPENROUTER_IS_FREE_TIER=" + str(data.get("is_free_tier") is True).lower(), flush=True)
              print("OPENROUTER_EXTERNAL_GET_COUNT=1", flush=True)
              print("OPENROUTER_MODEL_CALLS=0 METACULUS_POSTS=0 JOURNAL_WRITES=0", flush=True)
          except (KeyError, ValueError, TypeError):
              print("OPENROUTER_KEY_METADATA_INVALID_RESPONSE_NO_RETRY", flush=True)
              raise SystemExit(1) from None
          PY
