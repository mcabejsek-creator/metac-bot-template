# PR-only validation of bounded open-question pagination.
# No credentials, Metaculus GET/POST, or paid model requests.
name: Bounded pagination offline safety (no publishing)

on:
  pull_request:
    paths:
      - "main.py"
      - "automatic_one_selection.py"
      - "manual_next_candidate_preview.py"
      - "tests/test_manual_next_candidate_preview.py"
      - "docs/manual_next_public_candidate_preflight_20261108.md"
      - "scheduler_policy.py"
      - "dispatch_intent_controller.py"
      - "daily_rollover_review.py"
      - "tests/test_daily_rollover_review.py"
      - "docs/manual_utc_rollover_review_20261108.md"
      - "autonomous_orchestrator.py"
      - "github_publisher_queue_readonly.py"
      - "github_queue_preflight.py"
      - "authenticated_readonly_preflight.py"
      - "metaculus_one_post_history_readonly.py"
      - "tools/check_known_metaculus_history_readonly.py"
      - ".github/workflows/manual_one_post_history_readonly.yaml"
      - "tests/test_metaculus_one_post_history_readonly.py"
      - "docs/one_known_metaculus_post_history_20261108.md"
      - "tests/test_authenticated_readonly_preflight.py"
      - "docs/verified_readonly_sources_integration_20261108.md"
      - "tools/diagnose_github_queue_readonly.py"
      - "tests/test_github_queue_preflight.py"
      - ".github/workflows/manual_github_queue_diagnostic.yaml"
      - "docs/github_readonly_queue_preflight_20261108.md"
      - "tests/test_github_publisher_queue_readonly.py"
      - "docs/github_actions_support_evidence_20261108.md"
      - "tests/test_autonomous_orchestrator.py"
      - "docs/autonomous_orchestrator_dry_run_review_20261108.md"
      - "github_control_store.py"
      - "tests/test_dispatch_intent_controller.py"
      - "docs/autonomous_dispatch_control_review_20261108.md"
      - "perplexity_run_budget.py"
      - "research_safety.py"
      - "tests/test_perplexity_run_budget.py"
      - "docs/perplexity_automation_budget_review_20261108.md"
      - "tests/test_scheduler_policy.py"
      - "docs/futureeval_scheduler_activation_design_20261108.md"
      - "sponsored_credit_guard.py"
      - "tests/test_sponsored_credit_guard.py"
      - "tests/test_automatic_one_selection.py"
      - "bounded_open_question_selection.py"
      - "tests/test_bounded_open_question_selection.py"
      - "tests/test_runtime_limits.py"
      - "tests/test_github_publication.py"
      - "tests/test_publish_workflow_approval.py"
      - ".github/workflows/run_bot_on_tournament.yaml"
      - ".github/workflows/run_bot_on_metaculus_cup.yaml"
      - ".github/workflows/test_bot.yaml"
      - "tools/preflight_tournament_inventory_readonly.py"
      - "tools/audit_publication_journal_readonly.py"
      - ".github/workflows/readonly_inventory_preflight_manual.yaml"
      - "docs/vrchcab_bounded_pagination_review_20261107.md"
      - "worker_claim_offline.py"
      - "tests/test_worker_claim_offline.py"
      - "docs/worker_claim_cas_offline_20261109.md"
      - "docs/transactional_cas_design_20261109.md"
      - "dynamodb_cas_offline.py"
      - "tests/fake_dynamodb_control.py"
      - "tests/test_dynamodb_cas_offline.py"
      - "tools/verify_dynamodb_sdk_offline.py"
      - "command_gateway_offline.py"
      - "docs/command_gateway_security_20261109.md"
      - "tests/fake_command_auth.py"
      - "tests/test_command_gateway_offline.py"
      - ".github/workflows/offline_bounded_pagination.yaml"

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      METACULUS_TOKEN: ""
      METACULUS_TOKEN_V2: ""
      PERPLEXITY_API_KEY: ""
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      ASKNEWS_API_KEY: ""
      ASKNEWS_CLIENT_ID: ""
      ASKNEWS_SECRET: ""
      GITHUB_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Install locked dependencies without executing bot
        run: poetry install --no-interaction --no-root
      - name: Static syntax and source checks
        run: poetry run python -B -m py_compile manual_next_candidate_preview.py tests/test_manual_next_candidate_preview.py metaculus_one_post_history_readonly.py tools/check_known_metaculus_history_readonly.py tests/test_metaculus_one_post_history_readonly.py authenticated_readonly_preflight.py tests/test_authenticated_readonly_preflight.py github_queue_preflight.py tools/diagnose_github_queue_readonly.py tests/test_github_queue_preflight.py github_publisher_queue_readonly.py tests/test_github_publisher_queue_readonly.py autonomous_orchestrator.py tests/test_autonomous_orchestrator.py dispatch_intent_controller.py github_control_store.py tests/test_dispatch_intent_controller.py daily_rollover_review.py tests/test_daily_rollover_review.py main.py perplexity_run_budget.py research_safety.py tests/test_perplexity_run_budget.py automatic_one_selection.py scheduler_policy.py tests/test_scheduler_policy.py sponsored_credit_guard.py tests/test_sponsored_credit_guard.py tests/test_automatic_one_selection.py bounded_open_question_selection.py tools/preflight_tournament_inventory_readonly.py tools/audit_publication_journal_readonly.py tests/test_bounded_open_question_selection.py
      - name: Synthetic regression tests with socket-level network guard
        run: poetry run python -B -m unittest tests.test_manual_next_candidate_preview tests.test_metaculus_one_post_history_readonly tests.test_authenticated_readonly_preflight tests.test_github_queue_preflight tests.test_github_publisher_queue_readonly tests.test_autonomous_orchestrator tests.test_dispatch_intent_controller tests.test_daily_rollover_review tests.test_perplexity_run_budget tests.test_bounded_open_question_selection tests.test_automatic_one_selection tests.test_sponsored_credit_guard tests.test_scheduler_policy
      - name: Manual-preflight logic self-check (synthetic only; no credentials)
        run: poetry run python -B tools/preflight_tournament_inventory_readonly.py --self-check
      - name: Authenticated journal audit offline self-check (synthetic only)
        run: poetry run python -B tools/audit_publication_journal_readonly.py --self-check
      - name: Existing publisher and forecasting offline regressions
        env:
          METACULUS_PUBLICATION_BACKEND: github
        run: poetry run python -B -m tests.run --strict-known-bugs --report offline-results.json
