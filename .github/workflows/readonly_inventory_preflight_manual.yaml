# Strictly read-only inventory. NOT on a cron. NOT part of publisher.
# The single approved branch-only push trigger ran successfully ONCE
# (GitHub Actions run 42455748234, 2026-11-08), and has been removed.
# This workflow is now manual-dispatch ONLY. While confined to a draft PR,
# it cannot be dispatched via GitHub's default-branch workflow catalog.
# A fresh explicit user authorization is required before any further real GET.
name: Vrchcab manual inventory preflight (strictly GET only)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Approve up to 10 Metaculus GETs: counts only, or explicitly one PUBLIC post ID"
        type: choice
        required: true
        default: "DO_NOT_RUN"
        options:
          - "DO_NOT_RUN"
          - "YES_READ_ONLY_MAX_TEN_GETS"
          - "YES_FIND_ONE_PUBLIC_POST_ID"
      candidate_post_id:
        description: "Optional public post ID from a Metaculus question URL; not logged"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: vrchcab-manual-readonly-preflight
  cancel-in-progress: false

jobs:
  offline_safety:
    if: >-
      github.event_name == 'workflow_dispatch' && (inputs.confirmation == 'YES_READ_ONLY_MAX_TEN_GETS' || inputs.confirmation == 'YES_FIND_ONE_PUBLIC_POST_ID') && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      METACULUS_TOKEN: ""
      METACULUS_TOKEN_V2: ""
      PERPLEXITY_API_KEY: ""
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      ASKNEWS_API_KEY: ""
      GITHUB_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - run: poetry install --no-interaction --no-root
      - name: Exercise both-tournament inventory with synthetic data only
        run: poetry run python -B tools/preflight_tournament_inventory_readonly.py --self-check

  manual_get_only:
    if: >-
      github.event_name == 'workflow_dispatch' && (inputs.confirmation == 'YES_READ_ONLY_MAX_TEN_GETS' || inputs.confirmation == 'YES_FIND_ONE_PUBLIC_POST_ID') && github.run_attempt == 1
    needs: offline_safety
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN_V2 }}
      VRCHCAB_READONLY_PREFLIGHT_APPROVED: "YES_READ_ONLY_MAX_TEN_GETS"
      VRCHCAB_CANDIDATE_POST_ID: ${{ inputs.candidate_post_id }}
      PERPLEXITY_API_KEY: ""
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      ASKNEWS_API_KEY: ""
      GITHUB_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - run: poetry install --no-interaction --no-root
      - name: Authenticated GET-only inventory (strict maximum 10, zero posts)
        run: poetry run python -B tools/preflight_tournament_inventory_readonly.py --run-approved-readonly
