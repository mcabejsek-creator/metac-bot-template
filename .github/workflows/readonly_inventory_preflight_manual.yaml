# Strictly read-only inventory. NOT on a cron. NOT part of publisher.
# The default-branch manual-dispatch path is inert while this remains a draft PR.
# Before merge, an isolated-branch PUSH path can run only after an additional
# user-approved single commit with the exact one-shot authorization marker.
# Ordinary PR commits create skipped jobs, not authenticated GET requests.
name: Vrchcab manual inventory preflight (strictly GET only)

on:
  push:
    branches:
      - "fix/bounded-futureeval-pagination-20261107"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Approval for up to 10 authenticated Metaculus GETs, no POST or LLM"
        type: choice
        required: true
        default: "DO_NOT_RUN"
        options:
          - "DO_NOT_RUN"
          - "YES_READ_ONLY_MAX_TEN_GETS"

permissions:
  contents: read

concurrency:
  group: vrchcab-manual-readonly-preflight
  cancel-in-progress: false

jobs:
  offline_safety:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'YES_READ_ONLY_MAX_TEN_GETS' && github.run_attempt == 1) || (github.event_name == 'push' && github.ref == 'refs/heads/fix/bounded-futureeval-pagination-20261107' && github.event.head_commit.message == 'AUTHORIZE_ONCE_READONLY_INVENTORY_20261108' && github.run_attempt == 1)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      METACULUS_TOKEN: ""
      METACULUS_TOKEN_V2: ""
      PERPLEXITY_API_KEY: ""
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      ASKNEWS_API_KEY: ""
      GITHUB_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - run: poetry install --no-interaction --no-root
      - name: Exercise both-tournament inventory with synthetic data only
        run: poetry run python -B tools/preflight_tournament_inventory_readonly.py --self-check

  manual_get_only:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'YES_READ_ONLY_MAX_TEN_GETS' && github.run_attempt == 1) || (github.event_name == 'push' && github.ref == 'refs/heads/fix/bounded-futureeval-pagination-20261107' && github.event.head_commit.message == 'AUTHORIZE_ONCE_READONLY_INVENTORY_20261108' && github.run_attempt == 1)
    needs: offline_safety
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN_V2 }}
      VRCHCAB_READONLY_PREFLIGHT_APPROVED: "YES_READ_ONLY_MAX_TEN_GETS"
      PERPLEXITY_API_KEY: ""
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      ASKNEWS_API_KEY: ""
      GITHUB_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - run: poetry install --no-interaction --no-root
      - name: Authenticated GET-only inventory (strict maximum 10, zero posts)
        run: poetry run python -B tools/preflight_tournament_inventory_readonly.py --run-approved-readonly
