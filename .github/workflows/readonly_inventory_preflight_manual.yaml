# One-time manual GET-only inventory. NOT on a cron. NOT part of publisher.
# Requires a newly approved GitHub workflow_dispatch input for EACH run.
name: Vrchcab manual inventory preflight (strictly GET only)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Approval for up to 10 authenticated Metaculus GETs, no POST or LLM"
        type: choice
        required: true
        default: "DO_NOT_RUN"
        options:
          - "DO_NOT_RUN"
          - "YES_READ_ONLY_MAX_TEN_GETS"

permissions:
  contents: read

concurrency:
  group: vrchcab-manual-readonly-preflight
  cancel-in-progress: false

jobs:
  offline_safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      METACULUS_TOKEN: ""
      METACULUS_TOKEN_V2: ""
      PERPLEXITY_API_KEY: ""
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      ASKNEWS_API_KEY: ""
      GITHUB_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - run: poetry install --no-interaction --no-root
      - name: Exercise both-tournament inventory with synthetic data only
        run: poetry run python -B tools/preflight_tournament_inventory_readonly.py --self-check

  manual_get_only:
    if: github.event_name == 'workflow_dispatch' && inputs.confirmation == 'YES_READ_ONLY_MAX_TEN_GETS' && github.run_attempt == 1
    needs: offline_safety
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN_V2 }}
      VRCHCAB_READONLY_PREFLIGHT_APPROVED: "YES_READ_ONLY_MAX_TEN_GETS"
      PERPLEXITY_API_KEY: ""
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      ASKNEWS_API_KEY: ""
      GITHUB_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - run: poetry install --no-interaction --no-root
      - name: Authenticated GET-only inventory (strict maximum 10, zero posts)
        run: poetry run python -B tools/preflight_tournament_inventory_readonly.py --run-approved-readonly
