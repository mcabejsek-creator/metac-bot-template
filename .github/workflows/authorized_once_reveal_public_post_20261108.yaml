# Exactly one authorized authenticated GET-only public candidate ID inventory.
# Temporary isolated-branch workflow, immediately delete after scheduled first push.
# No predictions, LLMs, Metaculus POST, private forecast history logs or state writes.
name: Vrchcab ONE-SHOT GET-only public post ID discovery
on:
  push:
    branches:
      - ops/readonly-reveal-public-post-20261108
    paths:
      - ".github/workflows/authorized_once_reveal_public_post_20261108.yaml"

permissions:
  contents: read

concurrency:
  group: vrchcab-one-shot-readonly-public-id-20261108
  cancel-in-progress: false

jobs:
  offline_safety:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/ops/readonly-reveal-public-post-20261108' &&
      github.event.head_commit.message == 'AUTHORIZE_ONCE_PUBLIC_POST_ID_20261108' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      METACULUS_TOKEN: ""
      METACULUS_TOKEN_V2: ""
      GITHUB_TOKEN: ""
      OPENAI_API_KEY: ""
      OPENROUTER_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      PERPLEXITY_API_KEY: ""
      EXA_API_KEY: ""
      ASKNEWS_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - run: poetry install --no-interaction --no-root
      - name: Bounded inventory synthetic self-check (NO NETWORK)
        run: poetry run python -B tools/preflight_tournament_inventory_readonly.py --self-check

  readonly_candidate:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/ops/readonly-reveal-public-post-20261108' &&
      github.event.head_commit.message == 'AUTHORIZE_ONCE_PUBLIC_POST_ID_20261108' &&
      github.run_attempt == 1
    needs: offline_safety
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN_V2 }}
      GITHUB_TOKEN: ""
      OPENAI_API_KEY: ""
      OPENROUTER_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      PERPLEXITY_API_KEY: ""
      EXA_API_KEY: ""
      ASKNEWS_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - run: poetry install --no-interaction --no-root
      - name: Single authorized GET-only inventory with bounded public ID output
        shell: bash
        run: |
          poetry run python -B - <<'PY'
          from datetime import datetime, timezone
          import os
          import sys

          try:
              from forecasting_tools import MetaculusClient, BinaryQuestion
              from bounded_open_question_selection import (
                  BoundedPostReader, scan_open_tournament, deduplicate_tournaments,
              )
              from tools.preflight_tournament_inventory_readonly import RequestBudget, MAX_TOTAL_GETS
              if MAX_TOTAL_GETS != 10:
                  raise RuntimeError("Unexpected GET ceiling")
              credential = os.environ.get("METACULUS_TOKEN", "").strip()
              if len(credential) < 32 or any(c.isspace() for c in credential):
                  raise RuntimeError("Missing or malformed credential")
              client = MetaculusClient(token=credential.removeprefix("Token ").strip())
              budget = RequestBudget(BoundedPostReader(client))
              snapshot = datetime.now(timezone.utc)
              first = scan_open_tournament(client, 33121, read_page=budget, now=snapshot)
              second = scan_open_tournament(client, "minibench", read_page=budget, now=snapshot)
              first, second = deduplicate_tournaments(first, second)
              fresh = [q for q in first + second if q.already_forecasted is False]
              print("READ_ONLY_BOTH_INVENTORIES_COMPLETE=true", flush=True)
              print("AUTHENTICATED_METACULUS_GETS=" + str(budget.calls), flush=True)
              print("SNAPSHOT_UTC=" + snapshot.isoformat(), flush=True)
              print("UNFORECASTED_VALID_OPEN_COUNT=" + str(len(fresh)), flush=True)
              print("METACULUS_POSTS=0 MODELS=0 JOURNAL_WRITES=0", flush=True)
              if len(fresh) == 1:
                  q = fresh[0]
                  public_id = q.id_of_post
                  if type(public_id) is not int or public_id <= 0:
                      raise RuntimeError("Public post ID invalid")
                  print("PUBLIC_POST_ID=" + str(public_id), flush=True)
                  print("PUBLIC_QUESTION_URL=https://www.metaculus.com/questions/" + str(public_id) + "/", flush=True)
                  print("BINARY_FOR_FIRST_LIVE=" + str(isinstance(q, BinaryQuestion) and q.question_type == "binary").lower(), flush=True)
              else:
                  print("PUBLIC_POST_ID_NOT_RELEASED_COUNT_NOT_ONE=true", flush=True)
          except BaseException:
              print("READ_ONLY_ID_DISCOVERY_FAILED_CLOSED (details suppressed)", file=sys.stderr, flush=True)
              sys.exit(1)
          PY
