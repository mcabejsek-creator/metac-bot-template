name: One-shot OpenAI bonus connectivity probe

# One first-run-only synthetic request after reviewed merge; never scheduled.
# Later pushes and reruns cannot repeat the model call. No publisher is invoked.
on:
  push:
    branches: [main]
    paths:
      - "tools/probe_openai_bonus.py"
      - "tests/test_openai_bonus_probe.py"
      - ".github/workflows/openai_bonus_probe.yaml"

permissions:
  contents: read

concurrency:
  group: vrchcab-openai-bonus-probe-${{ github.repository }}
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      github.repository == 'mcabejsek-creator/metac-bot-template' &&
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Check syntax before exposing the test key
        run: python -B -m py_compile tools/probe_openai_bonus.py
      - name: One model GET and at most one bounded synthetic POST
        run: python -B tools/probe_openai_bonus.py
        env:
          VRCHCAB_OPENAI_TEST_KEY: ${{ secrets.VRCHCAB_OPENAI_TEST_KEY }}
