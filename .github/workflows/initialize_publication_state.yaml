name: Initialize publication state

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Old writers frozen, old attempts never rerun; historic outcomes remain unknown."
        type: choice
        required: true
        default: not-confirmed
        options:
          - not-confirmed
          - legacy-frozen-no-retries

permissions:
  contents: write

env:
  METACULUS_PUBLICATION_BACKEND: github
  METACULUS_PUBLICATION_STATE_BRANCH: metaculus-publication-state
  METACULUS_PUBLICATION_STATE_PATH: publication.enc
  METACULUS_PUBLICATION_SCOPE: default-bot

concurrency:
  group: metaculus-publication-${{ github.repository }}
  cancel-in-progress: false

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - run: poetry install --no-interaction --no-root
      - name: Offline publication regressions
        run: poetry run python -B -m tests.run
      - name: Initialize once; never overwrite an existing state ref
        env:
          GITHUB_TOKEN: ${{ github.token }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN_V2 }}
          PRIOR_RUNS_ACK: ${{ inputs.confirmation }}
        run: |
          if [ "$PRIOR_RUNS_ACK" != "legacy-frozen-no-retries" ]; then
            echo "Explicit legacy freeze/no-retries acknowledgement required; journal not initialized." >&2
            exit 1
          fi
          poetry run python -B -m github_publication --initialize --confirm-legacy-frozen-no-retries
