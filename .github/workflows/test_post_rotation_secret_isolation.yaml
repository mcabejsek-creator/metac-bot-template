# Offline guard: no tokens, no network API access, no publishing.
name: Verify isolated Metaculus V2 token bindings

on:
  pull_request:
    paths:
      - ".github/workflows/run_bot_on_tournament.yaml"
      - ".github/workflows/run_bot_on_metaculus_cup.yaml"
      - ".github/workflows/test_bot.yaml"
      - ".github/workflows/initialize_publication_state.yaml"
      - ".github/workflows/review_bot.yaml"
      - ".github/workflows/metaculus_history_audit.yaml"
      - "main.py"
      - "publication.py"
      - "publication_journal.py"
      - "github_publication.py"
      - ".github/workflows/test_post_rotation_secret_isolation.yaml"
      - "tools/test_post_rotation_secret_isolation.py"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Test credential isolation without secrets
        env:
          METACULUS_TOKEN: ""
          METACULUS_TOKEN_V2: ""
        run: python -B tools/test_post_rotation_secret_isolation.py
      - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Install locked dependencies
        run: poetry install --no-interaction --no-root
      - name: Smoke-test real virtualenv supervisor without forecast, network or API secrets
        run: .venv/bin/python -B -m bounded_run -- .venv/bin/python -B -c "print('SUPERVISOR_OFFLINE_OK')"
      - name: Full offline publication regression suite
        env:
          METACULUS_TOKEN: ""
          METACULUS_TOKEN_V2: ""
          METACULUS_PUBLICATION_BACKEND: github
          PERPLEXITY_API_KEY: ""
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
        run: poetry run python -B -m tests.run --strict-known-bugs
