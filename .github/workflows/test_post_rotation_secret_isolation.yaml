# Offline guard: no tokens, no network API access, no publishing.
name: Verify isolated Metaculus V2 token bindings

on:
  pull_request:
    paths:
      - ".github/workflows/run_bot_on_tournament.yaml"
      - ".github/workflows/run_bot_on_metaculus_cup.yaml"
      - ".github/workflows/test_bot.yaml"
      - ".github/workflows/initialize_publication_state.yaml"
      - ".github/workflows/review_bot.yaml"
      - ".github/workflows/test_post_rotation_secret_isolation.yaml"
      - "tools/test_post_rotation_secret_isolation.py"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test credential isolation without secrets
        env:
          METACULUS_TOKEN: ""
        run: python -B tools/test_post_rotation_secret_isolation.py
