name: Verify automatic model on synthetic data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "automatic_model.py"
      - "tools/smoke_automatic_model.py"
      - ".github/workflows/automatic_model_smoke.yaml"

permissions:
  contents: read

concurrency:
  group: vrchcab-model-smoke-${{ github.repository }}
  cancel-in-progress: false

jobs:
  smoke:
    if: >-
      github.repository == 'mcabejsek-creator/metac-bot-template' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Install locked dependencies
        run: poetry install --no-interaction --no-root
      - name: Offline model and credit checks
        run: poetry run python -B -m unittest tests.test_automatic_model tests.test_sponsored_credit_guard
      - name: One synthetic sponsored-model request
        run: poetry run python -B tools/smoke_automatic_model.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          METACULUS_SPONSORED_KEY_SUFFIX: "9fc"
