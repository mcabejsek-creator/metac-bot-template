# User approved up to two authorized read-only GETs on 2026-11-07.
# One use only: unique marker push, no workflow_dispatch, no schedule, reruns skipped.
name: One-time approved authenticated Metaculus GET inventory

on:
  push:
    branches:
      - diagnostics/open-questions-offline-20261107
    paths:
      - ".github/authorized_metaculus_probe_trigger_20261107.txt"

permissions:
  contents: read

jobs:
  authorized_probe:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'Execute approved two authorized Metaculus GETs (once)'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PERPLEXITY_API_KEY: ""
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      EXA_API_KEY: ""
      ASKNEWS_API_KEY: ""
      ASKNEWS_CLIENT_ID: ""
      ASKNEWS_SECRET: ""
    steps:
      - name: Checkout audited immutable diagnostics code only
        uses: actions/checkout@v4
        with:
          ref: 777eddc5f4fb4090ed1761a9a11e5c7b5efadc84
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify authorization request shape offline
        run: python -B tools/probe_open_questions_authenticated.py --self-check
      - name: Run no-more-than-two explicitly authorized GET requests
        run: python -B tools/probe_open_questions_authenticated.py --run-two-authorized-gets
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
