# Single-use, explicitly approved 2026-11-07: one identity GET only.
# No scheduled trigger, no manual dispatch, no retries, no forecast publication.
name: One-time identify existing Metaculus token owner

on:
  push:
    branches:
      - diagnostics/open-questions-offline-20261107
    paths:
      - ".github/trigger_identity_readonly_20261107.txt"

permissions:
  contents: read

jobs:
  token_owner:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'Execute approved single identity GET (once)'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout pinned reviewed identity probe
        uses: actions/checkout@v4
        with:
          ref: ae4afb7f4c65782ce5c8bffaee82ad16857603e2
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline proof of request shape (no network, no secrets)
        run: python -B tools/check_existing_metaculus_token_owner_readonly.py --self-check
      - name: One authenticated GET for own token identity only
        run: python -B tools/check_existing_metaculus_token_owner_readonly.py --run-one-authorized-get
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
