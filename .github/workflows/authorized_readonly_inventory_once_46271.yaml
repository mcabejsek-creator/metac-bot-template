# Single user-authorized GET-only inventory for one public post ID.
# This temporary file exists only in the isolated ops branch and MUST be deleted.
# No models, no Metaculus POST, no publication journal access or writes.
name: Vrchcab ONE-SHOT approved GET-only inventory post 46271
on:
  push:
    branches:
      - ops/readonly-inventory-46271-20261108
    paths:
      - ".github/workflows/authorized_readonly_inventory_once_46271.yaml"

permissions:
  contents: read

concurrency:
  group: vrchcab-authorized-readonly-inventory-46271
  cancel-in-progress: false

jobs:
  offline_safety:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/ops/readonly-inventory-46271-20261108' &&
      github.event.head_commit.message == 'AUTHORIZE_ONCE_READONLY_POST_46271_20261108' &&
      github.run_attempt == 1
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      METACULUS_TOKEN: ""
      METACULUS_TOKEN_V2: ""
      GITHUB_TOKEN: ""
      OPENAI_API_KEY: ""
      OPENROUTER_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      PERPLEXITY_API_KEY: ""
      EXA_API_KEY: ""
      ASKNEWS_API_KEY: ""
      ASKNEWS_CLIENT_ID: ""
      ASKNEWS_SECRET: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - run: poetry install --no-interaction --no-root
      - name: Verify bounded preflight with zero-network synthetic checks
        run: poetry run python -B tools/preflight_tournament_inventory_readonly.py --self-check

  authenticated_get_only:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/ops/readonly-inventory-46271-20261108' &&
      github.event.head_commit.message == 'AUTHORIZE_ONCE_READONLY_POST_46271_20261108' &&
      github.run_attempt == 1
    needs: offline_safety
    timeout-minutes: 8
    runs-on: ubuntu-latest
    env:
      METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN_V2 }}
      VRCHCAB_READONLY_PREFLIGHT_APPROVED: "YES_READ_ONLY_MAX_TEN_GETS"
      VRCHCAB_CANDIDATE_POST_ID: "46271"
      GITHUB_TOKEN: ""
      OPENAI_API_KEY: ""
      OPENROUTER_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      PERPLEXITY_API_KEY: ""
      EXA_API_KEY: ""
      ASKNEWS_API_KEY: ""
      ASKNEWS_CLIENT_ID: ""
      ASKNEWS_SECRET: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - run: poetry install --no-interaction --no-root
      - name: Authorized inventory for two tournaments, hard cap 10 Metaculus GETs, NO POST
        run: poetry run python -B tools/preflight_tournament_inventory_readonly.py --run-approved-readonly
