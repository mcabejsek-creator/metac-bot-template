# One-time operator-authorized authenticated GET-only preflight.
# Bound to public Metaculus post 46347. No models, POST, journal read/write.
# Remove this workflow after the single authorized launch.
name: Vrchcab ONE-SHOT verify public post 46347 type and history (GET only)
on:
  push:
    branches:
      - ops/readonly-verify-post-46347-20261108
    paths:
      - ".github/workflows/authorized_once_verify_post_46347.yaml"

permissions:
  contents: read

concurrency:
  group: vrchcab-one-shot-verify-public-post-46347
  cancel-in-progress: false

jobs:
  offline_safety:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/ops/readonly-verify-post-46347-20261108' &&
      github.event.head_commit.message == 'AUTHORIZE_ONCE_READONLY_POST_46347_TYPE_HISTORY_20261108' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      METACULUS_TOKEN: ""
      METACULUS_TOKEN_V2: ""
      GITHUB_TOKEN: ""
      OPENAI_API_KEY: ""
      OPENROUTER_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      PERPLEXITY_API_KEY: ""
      EXA_API_KEY: ""
      ASKNEWS_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - run: poetry install --no-interaction --no-root
      - name: Synthetic zero-network validation of 10-GET preflight
        run: poetry run python -B tools/preflight_tournament_inventory_readonly.py --self-check

  authenticated_readonly:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/ops/readonly-verify-post-46347-20261108' &&
      github.event.head_commit.message == 'AUTHORIZE_ONCE_READONLY_POST_46347_TYPE_HISTORY_20261108' &&
      github.run_attempt == 1
    needs: offline_safety
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN_V2 }}
      VRCHCAB_READONLY_PREFLIGHT_APPROVED: "YES_READ_ONLY_MAX_TEN_GETS"
      VRCHCAB_CANDIDATE_POST_ID: "46347"
      GITHUB_TOKEN: ""
      OPENAI_API_KEY: ""
      OPENROUTER_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      PERPLEXITY_API_KEY: ""
      EXA_API_KEY: ""
      ASKNEWS_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - run: poetry install --no-interaction --no-root
      - name: Authenticated GET-only snapshot (maximum 10), post 46347
        run: poetry run python -B tools/preflight_tournament_inventory_readonly.py --run-approved-readonly
