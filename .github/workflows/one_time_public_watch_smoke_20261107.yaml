# One-time authenticated GET-only read, using V2 secret only for Metaculus reads.
name: Single-shot V2-authenticated FutureEval and MiniBench GET smoke

on:
  push:
    branches:
      - prep/read-only-question-watch-20261107
    paths:
      - ".github/trigger_final_first_page_watch_20261107.txt"

permissions:
  contents: read

jobs:
  public_two_get:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'Run final first-page-only Metaculus monitor smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      METACULUS_TOKEN: ""
      METACULUS_TOKEN_V2: ""
      PERPLEXITY_API_KEY: ""
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3edb4fe8265038ec68c9f22b1c11c36cf477a212
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run offline schema tests, no network
        run: python -B tools/test_watch_open_metaculus_questions_readonly.py
      - name: Inspect only response shape and status counts with V2 auth; two GETs
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN_V2 }}
        run: python -B tools/watch_open_metaculus_questions_readonly.py --check-public-open-posts
