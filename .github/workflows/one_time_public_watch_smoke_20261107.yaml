# One-time authenticated GET-only read, using V2 secret only for Metaculus reads.
name: Single-shot V2-authenticated FutureEval and MiniBench GET smoke

on:
  push:
    branches:
      - prep/read-only-question-watch-20261107
    paths:
      - ".github/trigger_second_page_retry_20261107.txt"

permissions:
  contents: read

jobs:
  public_two_get:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'Run verified V2 GET second-page-only scan'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      METACULUS_TOKEN: ""
      METACULUS_TOKEN_V2: ""
      PERPLEXITY_API_KEY: ""
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3db2a483c7a3c4a1e48bad8ecb498c4e5de398f8
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run offline schema tests, no network
        run: python -B tools/test_watch_open_metaculus_questions_readonly.py
      - name: Inspect only response shape and status counts with V2 auth; two GETs
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN_V2 }}
        run: python -B tools/temporary_probe_open_api_shape_20261107.py
