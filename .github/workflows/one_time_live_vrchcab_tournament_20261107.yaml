# ONE user-approved supervised live run on 2026-11-07.
# FutureEval 33121 + current MiniBench only. NEVER Cup, Test Bot, or old run rerun.
# Single push marker and run_attempt==1 prevent repeated execution.
name: One-time supervised Vrchcab FutureEval and MiniBench live run

on:
  push:
    branches:
      - ops/one-time-live-tournament-20261107
    paths:
      - ".github/trigger_one_live_tournament_20261107.txt"

permissions:
  contents: write

concurrency:
  group: metaculus-publication-${{ github.repository }}
  cancel-in-progress: false

jobs:
  approved_live_tournament:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'Run one approved supervised Vrchcab FutureEval and MiniBench forecast'
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      EXPECTED_MAIN: f77f2329e9c09e787333416300ae35fa02f240a0
      METACULUS_PUBLICATION_BACKEND: github
      METACULUS_PUBLICATION_STATE_BRANCH: metaculus-publication-state
      METACULUS_PUBLICATION_STATE_PATH: publication.enc
      METACULUS_PUBLICATION_SCOPE: default-bot
    steps:
      - name: Checkout audited production main only
        uses: actions/checkout@v4
        with:
          ref: f77f2329e9c09e787333416300ae35fa02f240a0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Install locked dependencies
        run: poetry install --no-interaction --no-root
      - name: Source SHA and offline regression gate before all API secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          python -B tools/test_post_rotation_secret_isolation.py
          poetry run python -B -m tests.run --strict-known-bugs
      - name: Authenticate and read back protected journal (no Metaculus API call)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN_V2 }}
        run: |
          poetry run python -B - <<'PY'
          from github_publication import configured_store
          configured_store().preflight()
          print("PROTECTED_JOURNAL_PREFLIGHT_OK")
          PY
      - name: One approved live tournament run (Fall FutureEval and MiniBench)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN_V2 }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          poetry run python -B -m bounded_run -- python main.py --mode tournament
