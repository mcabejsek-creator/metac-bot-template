# One-shot explicit operator-approved GitHub workflow_dispatch bridge.
# Bridge can dispatch ONCE the existing default-off production workflow ONLY for public post 46347.
# No Metaculus API/model credentials, no publishing code here, no retries.
# Delete this file from the isolated ops branch after the first launch.
name: Vrchcab ONCE approved production forecast dispatcher post 46347
on:
  push:
    branches:
      - ops/one-live-dispatch-46347-20261108
    paths:
      - ".github/workflows/authorized_once_dispatch_46347.yaml"

permissions:
  contents: read
  actions: write

concurrency:
  group: vrchcab-authorized-one-time-dispatch-46347-20261108
  cancel-in-progress: false

jobs:
  dispatch_once:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/ops/one-live-dispatch-46347-20261108' &&
      github.repository == 'mcabejsek-creator/metac-bot-template' &&
      github.event.head_commit.message == 'AUTHORIZE_ONCE_LIVE_DISPATCH_POST_46347_20261108' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify exact production commit and dispatch authorized one-post workflow once
        env:
          GH_DISPATCH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          import urllib.error

          OWNER_REPO = "mcabejsek-creator/metac-bot-template"
          EXPECTED_MAIN = "4f5eb72a6bd2d186615be7d0db2d561e17a9c779"
          WORKFLOW = "run_bot_on_tournament.yaml"
          POST_ID = "46347"
          token = os.environ.get("GH_DISPATCH_TOKEN")
          if not token or os.environ.get("GITHUB_REPOSITORY") != OWNER_REPO:
              raise SystemExit("DISPATCH_ABORTED_INVALID_REPOSITORY_OR_TOKEN")

          class RejectRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          opener = urllib.request.build_opener(RejectRedirects())
          base = "https://api.github.com/repos/" + OWNER_REPO
          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "vrchcab-single-approved-dispatch",
          }

          def request_once(req):
              try:
                  return opener.open(req, timeout=20)
              except urllib.error.HTTPError as error:
                  print("GITHUB_API_REJECTED_HTTP_" + str(error.code) + "_NO_RETRY", flush=True)
                  raise SystemExit(1) from None
              except (OSError, TimeoutError):
                  print("GITHUB_DISPATCH_OUTCOME_UNKNOWN_DO_NOT_RETRY", flush=True)
                  raise SystemExit(1) from None

          ref_req = urllib.request.Request(base + "/git/ref/heads/main", headers=headers, method="GET")
          with request_once(ref_req) as response:
              if response.status != 200:
                  raise SystemExit("MAIN_REF_CHECK_REJECTED")
              try:
                  main_sha = json.load(response)["object"]["sha"]
              except (KeyError, ValueError, TypeError):
                  raise SystemExit("MAIN_REF_CHECK_MALFORMED") from None
          if main_sha != EXPECTED_MAIN:
              raise SystemExit("MAIN_CHANGED_ABORTED_NO_DISPATCH")
          print("EXPECTED_MAIN_COMMIT_VERIFIED=true", flush=True)

          payload = json.dumps({
              "ref": "main",
              "inputs": {
                  "publication_approval": "APPROVE_ONE_LIVE_PUBLICATION_RUN",
                  "first_live_post_id": POST_ID,
              },
          }).encode("utf-8")
          endpoint = base + "/actions/workflows/" + WORKFLOW + "/dispatches"
          send = urllib.request.Request(
              endpoint, data=payload,
              headers={**headers, "Content-Type": "application/json"},
              method="POST",
          )
          # Exactly one request, never retry after any failure or lost ACK.
          with request_once(send) as response:
              if response.status != 204:
                  raise SystemExit("GITHUB_DISPATCH_UNEXPECTED_STATUS_NO_RETRY")
          print("SINGLE_PUBLICATION_DISPATCH_ACCEPTED_204=true", flush=True)
          print("AUTHORIZED_PUBLIC_POST_ID=46347", flush=True)
          print("ONE_DISPATCH_REQUEST_ONLY_NO_BRIDGE_FORECAST_OR_MODEL", flush=True)
          PY
